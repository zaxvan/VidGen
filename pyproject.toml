[project]
name = "vidgen"
version = "0.1.0"
description = "VidGen - deployable video generation tool with pluggable providers"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "jinja2>=3.1.4",
  "python-multipart>=0.0.9",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "replicate>=0.32.0"
]

[tool.uv]
dev-dependencies = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.8"
]
